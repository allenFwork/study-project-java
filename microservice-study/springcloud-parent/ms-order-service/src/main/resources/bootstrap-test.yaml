# bootstrap.yaml文件是最先加载的配置文件
spring:
  application:
    name: ms-order-service        # 服务名称
  profiles:
    active: test                  # 启用开发环境的配置文件
  cloud:
    nacos:
      server-addr: nacos:8848 # Nacos服务的地址
      config:
        file-extension: yaml      # 文件后缀名
# 该项目启动后，会根据spring.cloud.nacos.server-addr获取nacos地址，
# 再根据 ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}作为文件id，来读取配置
# 此处最终读取的文件名就是 ms-order-service-dev.yaml