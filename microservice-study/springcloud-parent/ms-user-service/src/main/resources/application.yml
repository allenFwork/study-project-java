server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://192.168.80.4:3306/cloud_user?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  application:
    name: ms-user-service
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        cluster-name: HZ

mybatis:
  type-aliases-package: com.study.springcloud.user.pojo
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.study.springcloud.user: debug
  pattern:
    dateformat: MM-dd HH:mm:ss:SSS
