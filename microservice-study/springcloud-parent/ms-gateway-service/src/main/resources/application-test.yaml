server:
  port: 10010 # 网管端口
spring:
  application:
    name: ms-gateway-service
  cloud:
    nacos:
      server-addr: nacos:8848 # nacos服务地址
    gateway:
      routes: # 网关路由配置
        - id: ms-user-service          
          # uri: http://127.0.0.1:8081
          uri: lb://ms-user-service
          predicates:
            - Path=/user/**
            # - Query=name, Jack
            # - Method=GET
          filters:
            - AddRequestHeader=Truth, Superman is coming!
        - id: ms-order-service
          uri: lb://ms-order-service
          predicates:
            - Path=/order/**
      default-filters:                 # 默认过滤项
        - AddRequestHeader=Truth2, Batman is strong! # 添加请求头: "Truth2=Batman is strong!"(所有的请求)
      globalcors:                      # 全局的跨域处理
        add-to-simple-url-handler-mapping: true # 解决options请求被拦截问题
        corsConfigurations:
          '[/**]':
            allowedOrigins: # 允许哪些网站的跨域请求
              - "http://localhost:8090"
            allowedMethods: # 允许的跨域ajax的请求方式
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "OPTIONS"
            allowedHeaders: "*" # 允许在请求中携带的头信息
            allowCredentials: true # 是否允许携带cookie
            maxAge: 360000 # 这次跨域检测的有效期