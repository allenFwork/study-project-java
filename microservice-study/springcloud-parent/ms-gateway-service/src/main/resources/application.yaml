server:
  port: 10010 # 网管端口
spring:
  application:
    name: ms-gateway-service
  cloud:
    nacos:
      server-addr: localhost:8848 # nacos服务地址
    gateway:
      routes: # 网关路由配置
        - id: ms-user-service          # 路由id，自定义，只要唯一即可
          # uri: http://127.0.0.1:8081 # 路由的目标地址 http就是固定地址
          uri: lb://ms-user-service    # 路由的目标地址 lb就是负载均衡，后面跟服务名称
          predicates:                  # 路由断言，也就是判断请求是否符合路由规则的条件,也可以有多个
            - Path=/user/**            # 这个是按照路径匹配，只要以/user/开头就符合要求
            # - Query=name, Jack       # 请求参数必须包含指定参数
            # - Method=GET             # 请求方式必须是指定方式
          filters:                     # 过滤器
            - AddRequestHeader=Truth, Superman is coming! # 添加请求头: "Truth=Superman is coming!"(只对该服务的请求)
      default-filters:                 # 默认过滤项
        - AddRequestHeader=Truth2, Batman is strong! # 添加请求头: "Truth2=Batman is strong!"(所有的请求)
      globalcors:                      # 全局的跨域处理
        add-to-simple-url-handler-mapping: true # 解决options请求被拦截问题
        corsConfigurations:
          '[/**]':
            allowedOrigins: # 允许哪些网站的跨域请求
              - "http://localhost:8090"
              - "http://localhost:63342" # 本地浏览器打开html文件时，使用了63342端口
            allowedMethods: # 允许的跨域ajax的请求方式
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "OPTIONS"
            allowedHeaders: "*" # 允许在请求中携带的头信息
            allowCredentials: true # 是否允许携带cookie
            maxAge: 360000 # 这次跨域检测的有效期