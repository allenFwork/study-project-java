logging:
  pattern:
    dateformat: HH:mm:ss:SSS
  level:
    com.study.mq: debug
spring:
  rabbitmq:
    host: 192.168.80.4 # rabbitMQ的ip地址
    port: 5672 # 端口
    username: allen
    password: 123456
    virtual-host: /
    listener:
      simple:
        prefetch: 1
#        acknowledge-mode: none # 关闭ack
#        acknowledge-mode: auto
        retry:
          enabled: true # 开启消费者失败重试
          initial-interval: 1000 # 初始的失败等待时长为1秒
          multiplier: 2 # 失败的等待时长倍数，下次等待时长 = multiplier * last-interval
          max-attempts: 3 # 最大重试次数
          stateless: true # true无状态；false有状态。如果业务中包含事务，这里改为false，保证重试时事务的正常使用