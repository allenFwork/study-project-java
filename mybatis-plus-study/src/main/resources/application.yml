spring:
  datasource:
    url: jdbc:mysql://192.168.80.4:3306/mybatis_plus?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

logging:
  level:
    com.study.mybatis_plus: debug
  pattern:
    dateformat: HH:mm:ss

# mybatis相关配置
#mybatis:
#  mapper-locations: classpath*:mapper/*.xml
# mybatis plus相关配置
mybatis-plus:
  mapper-locations: "classpath*:/mapper/**/*.xml"     # Mapper.xml文件地址，当前这个是默认值。
  type-aliases-package: com.study.mybatis_plus.domain.po
  global-config:
    db-config:
      id-type: auto # 全局id类型为自增长(数据库自增长)
      logic-delete-field: deleted # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1       # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0   # 逻辑未删除值(默认为 0)
  configuration:
    # 是否开启 表字段下划线 与 java类对象属性的驼峰命名 映射
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# 配置swagger信息
knife4j:
  enable: true
  openapi:
    title: 用户管理接口文档
    description: "用户管理接口文档"
    email: 1042160867@qq.com
    concat: allen
    url: https://www.baidu.com
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.study.mybatis_plus.controller