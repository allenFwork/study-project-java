server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://192.168.80.4:3306/cloud_order?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  application:
    name: ms-order-service

mybatis:
  type-aliases-package: com.study.springcloud.order.pojo
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.study.springcloud.order: debug
  pattern:
    dateformat: MM-dd HH:mm:ss:SSS

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:10086/eureka

ms-user-service: # 给某个微服务配置负载均衡规则，这里是ms-user-service服务
  ribbon:
#    NFLoadBalancerRuleClassName: com.netflix.loadbalancer.RandomRule    # 负载均衡规则(随机策略)
    NFLoadBalancerRuleClassName: com.netflix.loadbalancer.RoundRobinRule # 负载均衡规则(轮询策略)

ribbon:
  # Ribbon默认是采用懒加载，即第一次访问时才会去创建LoadBalanceClient，请求时间会很长。
  # 而饥饿加载则会在项目启动时创建，降低第一次访问的耗时
  eager-load:
    enabled: true
    clients: ms-user-service