security.login.username=root
security.login.password=123456
#eureka.client.service-url.defaultZone=http://${security.login.username}:${security.login.password}@localhost:9000/eureka/

server.port=8081
# 注册到eureka服务端的微服务名称,由多个微服务节点组成的集群名称
spring.application.name=ms-eureka-client
# 注册到eureka服务端的地址
#eureka.client.service-url.defaultZone=http://${security.login.username}:${security.login.password}
eureka.client.service-url.defaultZone=http://localhost:9000/eureka/
# 点击具体的微服务,右下角是否显示ip
eureka.instance.prefer-ip-address=true
# 显示微服务名称
eureka.instance.instance-id=ms-eureka-client-0001

mybatis.configuration.map-underscore-to-camel-case=true
# 配置数据库
spring.datasource.url=jdbc:mysql://localhost:3307/test
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

logging.level.com.study.dao=debug

