# bootstrap.yml 的优先级高于 application.yml
spring:
  cloud:
    config:
      # 从云上拿的配置文件的名字,对应获取规则的 {application}
      name: test-config
      # 这个是要获取的环境,对应的便是 {profile}
      profile: dev
      # 这个就是获取的节点,对应的是 {label}
      label: master
      # 这就是 config-server 的一个地址
      uri: http://localhost:8080/
