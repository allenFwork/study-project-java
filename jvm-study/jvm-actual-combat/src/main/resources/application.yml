arthas:
  # tunnel地址，目前是部署在同一台服务器，正式环境需要拆分
  tunnel-server: ws://localhost:7777/ws
  # tunnel显示的应用名称，直接使用应用名
  app-name: ${spring.application.name}
  # arthas http访问的端口和远程连接的端口
  http-port: 8888
  telnet-port: 9999

server:
  port: 8881
  tomcat:
    threads:
      min-spare: 50    # 设置tomcat的核心线程数为50，即使tomcat空闲下来，这些线程也不会回收 (此处即使设置为0，也不会生效，默认最小是10个核心线程)
      max: 500         # 设置tomcat的线程池最大为500

mybatis:
  mapper-locations: classpath:mapper/*xml
  type-aliases-package: com.study.jvm.actual_combat.practice_demo.oom.pojo
